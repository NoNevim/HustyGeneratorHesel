<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeneratorHesla</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 1.6em;
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      font-weight: bold;
    }

    input {
      width: 16ch;
      padding: 6px 8px;
      font-size: 1em;
    }

    button {
      padding: 6px 14px;
      font-size: 1em;
      cursor: pointer;
    }

    .odsad,
    .neodsad {
      font-weight: bold;
    }

    .odsad {
      margin-left: 5ch;
    }

    .pass {
      font-size: 1.1em;
      margin-top: 40px;
    }

    .other {
      white-space: pre-line;
    }

    .copy-wrap {
      margin-top: 10px;
    }

    #copyBtn {
      display: none;
    }

    #copyBtn.visible {
      display: inline-block;
    }

    #copyBtn.copied {
      background-color: #c9f7c5;
    }
  </style>
</head>
<body>

  <h1>Velmi husty generator hesel</h1>

  <div class="form-row">
    <label for="jmeno">Generuj heslo pro:</label>
    <input id="jmeno" type="text" placeholder="jméno kolegy/kolegyně">
    <button id="generateBtn">Generuj heslo</button>
  </div>

  <p class="pass">------------</p>

  <p class="other"></p>

  <div class="copy-wrap">
    <button id="copyBtn">Kopírovat text</button>
  </div>

  <script>
    const pass = document.querySelector('.pass');
    const other = document.querySelector('.other');
    const generateBtn = document.querySelector('#generateBtn');
    const copyBtn = document.querySelector('#copyBtn');
    const vstup = document.querySelector('#jmeno');

    const append = "987654321";
    const firstCharacter = "ABCDEFGHJKLMNPQRSTUVWX";
    const secondCharacter = "abcdefghjkmnpqrstuvx";
    const delkaFirstChar = firstCharacter.length;
    const delkaSecondChar = secondCharacter.length;

    let poslednitext = "";

    function generujHeslo() {
      return (firstCharacter.charAt(random(delkaFirstChar)) + secondCharacter.charAt(random(delkaSecondChar)) + secondCharacter.charAt(random(delkaSecondChar)) + append);
    }

    function random(number) {
      return Math.floor(Math.random() * number);
    }

    function vypis() {
      const outpHeslo = generujHeslo();
      if (vstup.value === "") {
        pass.innerHTML = `<span class="neodsad">${outpHeslo}</span>`;
        other.innerHTML = "";
        poslednitext = outpHeslo;
      } else {
        pass.innerHTML = `Nové heslo pro Váš účet <strong>${vstup.value}</strong> do OMS je:        <span class="odsad">${outpHeslo}</span>`;
        other.innerHTML = `Vyzkoušejte prosím přihlášení a pokud se zadaří, heslo si prosím rovnou změňte (návod posílám v příloze).<br/>
                          Kdyby byl někde problém, klidně pište/volejte. <br/><br/><br/>S pozdravem`;
        poslednitext = `Nové heslo pro Váš účet ${vstup.value} do OMS je: ${outpHeslo}\n\n` +
          `Vyzkoušejte prosím přihlášení a pokud se zadaří, heslo si prosím rovnou změňte (návod posílám v příloze).\n` +
          `Kdyby byl někde problém, klidně pište/volejte.\n\n\nS pozdravem`;
      }
      copyBtn.classList.add('visible');
      copyBtn.classList.remove('copied');
      copyBtn.textContent = 'Kopírovat text';
    }

    async function kopirovat() {
      try {
        await navigator.clipboard.writeText(poslednitext);
        copyBtn.textContent = 'Zkopírováno ✓';
        copyBtn.classList.add('copied');
      } catch (err) {
        copyBtn.textContent = 'Nepodařilo se zkopírovat';
      }
    }

    generateBtn.addEventListener('click', vypis);    // spusteni pri stisku tlacitka

    vstup.addEventListener('change', vypis);    // spusteni pri zmene hodnoty ve vstupnim poli

    copyBtn.addEventListener('click', kopirovat);
  </script>

</body>
</html>
